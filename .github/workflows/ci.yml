name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v8
        with:
          enable-cache: true
      - name: Install
        run: uv sync --all-extras --no-editable
      - name: Lint
        run: .venv/bin/ruff check .
      - name: Test
        shell: bash
        run: |
          SITE_PACKAGES=$(.venv/bin/python -c 'import site; print(site.getsitepackages()[0])')
          LD_LIBRARY_PATH="$SITE_PACKAGES${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" .venv/bin/pytest
